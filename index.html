tt.style.top=Math.max(12,Math.min(innerHeight-h-12,!e?(innerHeight-h)/2:r.top+r.height/2>innerHeight/2?r.top-pd-14-h:r.bottom+pd+14))+'px'}
function draw(){const last=i===P.length-1;$('wk-t').innerHTML=`<div class="wd">${P.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}${last?'':'<button id="wsk">Skip</button>'}</div><b>${P[i][1]}</b><p>${P[i][2]}</p><div class="wb">${i?'<button class="chip" id="wbk">Back</button>':''}<button class="chip on" id="wn">${last?'Add my first habit':i?'Next':'Start tour'}</button></div>`;
$('wn').onclick=()=>last?fin(1):(i++,draw());const b=$('wbk'),k=$('wsk');if(b)b.onclick=()=>{i--;draw()};if(k)k.onclick=()=>fin();pos()}
addEventListener('resize',pos);draw()}
render();
(()=>{let a='';try{a=new URLSearchParams(location.search).get('a')||''}catch(e){}if(!a)return;try{history.replaceState(null,'',location.pathname)}catch(e){}setTimeout(()=>{if($('wk'))return;if(a==='speech'){msub='speech';go('more',1)}else if(a==='habit'||a==='diary'){go('home');openAdd();setT(a)}},1500)})();
setTimeout(()=>{let seen='';try{seen=localStorage.getItem('pai-intro')||''}catch(e){}if(seen)return;if(hasData()){try{localStorage.setItem('pai-intro','1')}catch(e){}return}walk()},1200);
addEventListener('pagehide',()=>{if(sp.on)spStop()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&sp.on)spStop()});
</script>
</body>
